[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cli-agent-mcp"
version = "1.0.0"
description = "Optional Docker-related MCP servers for cli-agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.9,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9,<10",
]

[project.scripts]
cli-agent-compose-mcp = "cli_agent_mcp.compose_server:main"
cli-agent-python-validator-mcp = "cli_agent_mcp.python_validator_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cli_agent_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E501"]
